AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Final Real-Time Analytics Dashboard on Cloud.
  Customer shopping website + protected admin analytics dashboard + API Gateway +
  Lambda + DynamoDB + S3 + EC2, deployed from one CloudFormation stack.

Parameters:
  AdminUsername:
    Type: String
    Default: admin
    Description: Username for the protected /admin dashboard.
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password for the protected /admin dashboard.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
    Description: EC2 instance type.

Resources:

  # ---------------- NETWORK ----------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: VPC-realtime

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: VPC-realtime-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VPC-realtime-subnet

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: VPC-realtime-route

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP web server and SSH administration
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: websecuritygroup

  # ---------------- STORAGE ----------------
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DynamoDB-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: Real-Time Analytics Dashboard

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DynamoDB-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      Tags:
        - Key: Project
          Value: Real-Time Analytics Dashboard

  RawOrdersBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub realtimebucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: Real-Time Analytics Dashboard

  # ---------------- LAMBDA ----------------
  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Lambda-orderprocessor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RTAD-Lambda-Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource: !GetAtt OrdersTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt UsersTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${RawOrdersBucket.Arn}/*'

  OrderApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Lambda-orderprocessor
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt OrderLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          USERS_TABLE: !Ref UsersTable
          BUCKET_NAME: !Ref RawOrdersBucket
      Code:
        ZipFile: |
          import os, json, uuid, boto3
          from datetime import datetime, timezone
          from decimal import Decimal

          dynamodb = boto3.resource("dynamodb")
          s3 = boto3.client("s3")
          table = dynamodb.Table(os.environ["TABLE_NAME"])

          def cors(body, status=200):
              return {
                  "statusCode": status,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*",
                      "Access-Control-Allow-Headers": "content-type",
                      "Access-Control-Allow-Methods": "GET,POST,OPTIONS"
                  },
                  "body": json.dumps(body, default=str)
              }

          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "")
              path = event.get("rawPath", "")
              if method == "OPTIONS":
                  return cors({"ok": True})
              if method == "POST" and path.endswith("/signup"):
                  try:
                      body = json.loads(event.get("body") or "{}")
                      name = str(body.get("name", "")).strip()
                      email = str(body.get("email", "")).strip().lower()
                      password = str(body.get("password", ""))
                      if not name or not email or len(password) < 6 or "@" not in email:
                          return cors({"message": "Enter valid name, email and password (6+ characters)."}, 400)
                      users = dynamodb.Table(os.environ["USERS_TABLE"])
                      if users.get_item(Key={"email": email}).get("Item"):
                          return cors({"message": "Account already exists. Please login."}, 409)
                      import hashlib
                      users.put_item(Item={"email": email, "name": name, "passwordHash": hashlib.sha256(password.encode()).hexdigest()})
                      return cors({"success": True, "message": "Account created. You can login now."}, 201)
                  except Exception as e:
                      return cors({"message": "Signup error", "error": str(e)}, 500)

              if method == "POST" and path.endswith("/login"):
                  try:
                      body = json.loads(event.get("body") or "{}")
                      email = str(body.get("email", "")).strip().lower()
                      password = str(body.get("password", ""))
                      import hashlib
                      users = dynamodb.Table(os.environ["USERS_TABLE"])
                      item = users.get_item(Key={"email": email}).get("Item")
                      if not item or item.get("passwordHash") != hashlib.sha256(password.encode()).hexdigest():
                          return cors({"message": "Invalid email or password."}, 401)
                      return cors({"success": True, "name": item.get("name"), "email": email, "message": "Login successful"})
                  except Exception as e:
                      return cors({"message": "Login error", "error": str(e)}, 500)

              if method == "POST" and path.endswith("/orders"):
                  try:
                      body = json.loads(event.get("body") or "{}")
                      customer = str(body.get("customerName", "")).strip()
                      email = str(body.get("email", "")).strip()
                      product = str(body.get("product", "")).strip()
                      qty = int(body.get("quantity", 1))
                      amount = Decimal(str(body.get("amount", 0)))
                      if not customer or not product or qty < 1 or amount < 0:
                          return cors({"message": "Invalid order data"}, 400)

                      order_id = "ORD" + uuid.uuid4().hex[:8].upper()
                      now = datetime.now(timezone.utc).isoformat()
                      item = {
                          "orderId": order_id,
                          "customerName": customer,
                          "email": email,
                          "product": product,
                          "quantity": qty,
                          "amount": amount,
                          "status": "Placed",
                          "createdAt": now
                      }
                      table.put_item(Item=item)
                      key = "orders/" + order_id + ".json"
                      s3.put_object(
                          Bucket=os.environ["BUCKET_NAME"],
                          Key=key,
                          Body=json.dumps(item, default=str).encode(),
                          ContentType="application/json"
                      )
                      return cors({
                          "success": True,
                          "orderId": order_id,
                          "message": "Order placed successfully"
                      }, 201)
                  except Exception as e:
                      return cors({"message": "Server error", "error": str(e)}, 500)

              if method == "GET" and path.endswith("/analytics"):
                  try:
                      rows = table.scan().get("Items", [])
                      total_orders = len(rows)
                      total_sales = sum(Decimal(str(x.get("amount", 0))) for x in rows)
                      products_sold = sum(int(x.get("quantity", 0)) for x in rows)
                      customers = len(set(str(x.get("email") or x.get("customerName")) for x in rows))
                      product_totals = {}
                      for x in rows:
                          p = str(x.get("product", "Unknown"))
                          product_totals[p] = product_totals.get(p, 0) + int(x.get("quantity", 0))
                      recent = sorted(rows, key=lambda x: str(x.get("createdAt", "")), reverse=True)[:10]
                      for x in recent:
                          x["amount"] = str(x.get("amount", "0"))
                      return cors({
                          "totalOrders": total_orders,
                          "totalSales": str(total_sales),
                          "productsSold": products_sold,
                          "customers": customers,
                          "productTotals": product_totals,
                          "recentOrders": recent
                      })
                  except Exception as e:
                      return cors({"message": "Analytics error", "error": str(e)}, 500)

              if method == "GET" and path.endswith("/orders"):
                  try:
                      rows = table.scan().get("Items", [])
                      rows = sorted(rows, key=lambda x: str(x.get("createdAt", "")), reverse=True)[:50]
                      return cors({"orders": rows})
                  except Exception as e:
                      return cors({"message": "Orders error", "error": str(e)}, 500)

              return cors({"message": "Not found"}, 404)

  # ---------------- API GATEWAY ----------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: API-orders
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OrderApiFunction.Arn
      PayloadFormatVersion: '2.0'

  SignupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /signup
      Target: !Sub integrations/${ApiIntegration}

  LoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /login
      Target: !Sub integrations/${ApiIntegration}

  PostOrderRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /orders
      Target: !Sub integrations/${ApiIntegration}

  AnalyticsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /analytics
      Target: !Sub integrations/${ApiIntegration}

  OrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /orders
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # ---------------- EC2 ----------------
  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EC2-webserver-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RTAD-EC2-ReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'

  WebServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: EC2-webserver-profile
      Roles:
        - !Ref WebServerRole

  WebServer:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - ApiStage
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}'
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref WebServerProfile
      Tags:
        - Key: Name
          Value: EC2-webserver
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y nginx apache2-utils

            mkdir -p /var/www/html/admin
            rm -f /var/www/html/index.nginx-debian.html

            cat > /var/www/html/index.html <<'HTML'
            <!doctype html>
            <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>ShopEasy - Real-Time Cloud Shopping</title>
              <style>
                *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
                header{background:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 8px #ddd}
                .brand{font-size:25px;font-weight:800;color:#1769ff}.nav{display:flex;gap:20px}
                .hero{margin:28px auto;max-width:1100px;background:linear-gradient(120deg,#1769ff,#63a4ff);color:white;padding:45px;border-radius:20px}
                .hero h1{font-size:40px;margin:0 0 10px}.hero p{font-size:18px}
                .container{max-width:1100px;margin:auto;padding:10px 20px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
                .card{background:white;border-radius:16px;padding:18px;box-shadow:0 3px 14px #dfe4ef}.emoji{font-size:70px;text-align:center}
                button{border:0;border-radius:9px;padding:12px 18px;background:#1769ff;color:white;font-weight:700;cursor:pointer}
                input{padding:12px;border:1px solid #ccd3df;border-radius:8px;width:100%;margin:5px 0 12px}
                .box{background:#fff;padding:22px;border-radius:16px;margin:25px 0}.success{display:none;background:#e8fff0;padding:20px;border-radius:14px}
                footer{text-align:center;padding:35px;color:#667085}
              </style>
            </head>
            <body>
              <header><div class="brand">ShopEasy</div><div class="nav"><span id="userNav">Please login</span><span>🛒 Cart <b id="cartCount">0</b></span></div></header>
              <section id="auth" class="box" style="max-width:460px;margin:50px auto">
                <h1 id="authTitle">Welcome to ShopEasy</h1>
                <p id="authSub">Login to continue shopping</p>
                <div id="signupNameWrap" style="display:none"><input id="name" placeholder="Full name"></div>
                <input id="email" type="email" placeholder="Email address">
                <input id="password" type="password" placeholder="Password (6+ characters)">
                <button id="authBtn" onclick="login()">Login</button>
                <p><a href="#" onclick="toggleAuth();return false" id="toggleLink">Don't have an account? Sign Up</a></p>
                <p id="loginMsg"></p>
              </section>
              <main id="shop" class="container" style="display:none">
                <section class="hero">
                  <h1>Better Products.<br>Better Life.</h1>
                  <p>Cloud-powered online shopping with real-time analytics.</p>
                </section>
                <h2 id="products">Popular Products</h2>
                <div class="products">
                  <div class="card"><div class="emoji">👟</div><h3>Sports Shoes</h3><p>₹2,499</p><button onclick="add('Sports Shoes',2499)">Add to Cart</button></div>
                  <div class="card"><div class="emoji">💻</div><h3>Laptop</h3><p>₹54,999</p><button onclick="add('Laptop',54999)">Add to Cart</button></div>
                  <div class="card"><div class="emoji">📱</div><h3>Smartphone</h3><p>₹19,999</p><button onclick="add('Smartphone',19999)">Add to Cart</button></div>
                  <div class="card"><div class="emoji">🎧</div><h3>Headphones</h3><p>₹2,999</p><button onclick="add('Headphones',2999)">Add to Cart</button></div>
                </div>
                <div class="box">
                  <h2>🛒 Your Cart</h2><p id="cartText">Your cart is empty.</p>
                  <button onclick="placeOrder()">Place Order</button>
                  <div id="success" class="success"></div>
                </div>
              </main>
              <footer>ShopEasy • Real-Time Analytics Dashboard on Cloud</footer>
              <script>
                const API="__API_URL__";
                let cart=null, customer={name:"",email:""}, signupMode=false;
                function toggleAuth(){
                  signupMode=!signupMode;
                  document.getElementById("authTitle").textContent=signupMode?"Create your ShopEasy account":"Welcome to ShopEasy";
                  document.getElementById("authSub").textContent=signupMode?"Create an account to start shopping":"Login to continue shopping";
                  document.getElementById("signupNameWrap").style.display=signupMode?"block":"none";
                  document.getElementById("authBtn").textContent=signupMode?"Create Account":"Login";
                  document.getElementById("toggleLink").textContent=signupMode?"Already have an account? Login":"Don't have an account? Sign Up";
                  document.getElementById("loginMsg").textContent="";
                }
                async function login(){
                  const name=document.getElementById("name").value.trim();
                  const email=document.getElementById("email").value.trim();
                  const password=document.getElementById("password").value;
                  const msg=document.getElementById("loginMsg");
                  if(signupMode){
                    if(!name||!email||password.length<6){msg.textContent="Enter name, valid email and 6+ character password.";return}
                    const r=await fetch(API+"/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,password})});
                    const d=await r.json(); msg.textContent=d.message||"";
                    if(d.success){
                      signupMode=false;
                      document.getElementById("authTitle").textContent="Welcome to ShopEasy";
                      document.getElementById("authSub").textContent="Login to continue shopping";
                      document.getElementById("signupNameWrap").style.display="none";
                      document.getElementById("authBtn").textContent="Login";
                      document.getElementById("toggleLink").textContent="Don't have an account? Sign Up";
                      document.getElementById("name").value="";
                      document.getElementById("password").value="";
                    }
                    return;
                  }
                  if(!email||!password){msg.textContent="Enter email and password.";return}
                  const r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
                  const d=await r.json();
                  if(d.success){
                    customer={name:d.name,email:d.email};
                    document.getElementById("auth").style.display="none";
                    document.getElementById("shop").style.display="block";
                    document.getElementById("userNav").textContent="Hi, "+d.name+" • 🛒 Cart "+document.getElementById("cartCount").textContent;
                  }else msg.textContent=d.message||"Login failed";
                }
                function add(product,amount){
                  cart={product,amount,quantity:1};
                  document.getElementById("cartCount").textContent="1";
                  document.getElementById("userNav").textContent="Hi, "+customer.name+" • 🛒 Cart 1";
                  document.getElementById("cartText").textContent=product+" × 1 — ₹"+amount.toLocaleString("en-IN");
                  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
                }
                async function placeOrder(){
                  if(!cart){alert("Please add a product.");return}
                  const r=await fetch(API+"/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customerName:customer.name,email:customer.email,product:cart.product,quantity:cart.quantity,amount:cart.amount})});
                  const d=await r.json();
                  const box=document.getElementById("success");
                  if(d.success){box.style.display="block";box.innerHTML="<h2>✓ Order Placed Successfully!</h2><p>Your Order ID: <b>"+d.orderId+"</b></p><p>Thank you for shopping with ShopEasy!</p>";cart=null;document.getElementById("cartCount").textContent="0";}
                  else alert(d.message||"Order failed");
                }
              </script>
            </body>
            </html>
            HTML

            cat > /var/www/html/admin/index.html <<'HTML'
            <!doctype html>
            <html>
            <head>
              <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
              <title>ShopEasy Admin Analytics</title>
              <style>
                *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
                header{background:#101c33;color:white;padding:18px 4%;display:flex;justify-content:space-between}
                .wrap{max-width:1200px;margin:25px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
                .card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px #dde2ec}.num{font-size:28px;font-weight:800;margin-top:10px}
                .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}table{width:100%;border-collapse:collapse;background:white}
                th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}h1{margin:0}.small{color:#667085}
                @media(max-width:800px){.cards,.grid{grid-template-columns:1fr}}
              </style>
            </head>
            <body>
              <header><div><b>ShopEasy</b> — Admin Analytics</div><div>Real-Time Dashboard</div></header>
              <div class="wrap">
                <h1>Welcome, Admin!</h1><p class="small">Live cloud order analytics • Auto refresh every 5 seconds</p>
                <div class="cards">
                  <div class="card">Total Orders<div class="num" id="orders">0</div></div>
                  <div class="card">Total Sales<div class="num" id="sales">₹0</div></div>
                  <div class="card">Products Sold<div class="num" id="products">0</div></div>
                  <div class="card">Customers<div class="num" id="customers">0</div></div>
                </div>
                <div class="grid">
                  <div class="card"><h2>Product-wise Sales</h2><div id="productsList">Loading...</div></div>
                  <div class="card"><h2>Recent Orders</h2><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th></tr></thead><tbody id="recent"></tbody></table></div></div>
                </div>
                <p id="status" class="small"></p>
              </div>
              <script>
                const API="__API_URL__";
                async function load(){
                  try{
                    const r=await fetch(API+"/analytics"); const d=await r.json();
                    document.getElementById("orders").textContent=d.totalOrders;
                    document.getElementById("sales").textContent="₹"+Number(d.totalSales).toLocaleString("en-IN");
                    document.getElementById("products").textContent=d.productsSold;
                    document.getElementById("customers").textContent=d.customers;
                    document.getElementById("productsList").innerHTML=Object.entries(d.productTotals||{}).map(x=>"<p><b>"+x[0]+"</b> — "+x[1]+" sold</p>").join("")||"No orders yet";
                    document.getElementById("recent").innerHTML=(d.recentOrders||[]).map(x=>"<tr><td>"+x.orderId+"</td><td>"+x.customerName+"</td><td>"+x.product+"</td><td>₹"+Number(x.amount).toLocaleString("en-IN")+"</td><td>"+x.status+"</td></tr>").join("");
                    document.getElementById("status").textContent="● System operational • Last updated: "+new Date().toLocaleTimeString();
                  }catch(e){document.getElementById("status").textContent="Dashboard API unavailable: "+e.message}
                }
                load();setInterval(load,5000);
              </script>
            </body>
            </html>
            HTML

            API_URL='${HttpApi.ApiEndpoint}'
            sed -i "s|__API_URL__|$API_URL|g" /var/www/html/index.html /var/www/html/admin/index.html

            htpasswd -bc /etc/nginx/.htpasswd '${AdminUsername}' '${AdminPassword}'
            cat > /etc/nginx/sites-available/default <<'NGINX'
            server {
              listen 80 default_server;
              root /var/www/html;
              index index.html;
              location /admin/ {
                auth_basic "Admin Dashboard";
                auth_basic_user_file /etc/nginx/.htpasswd;
                try_files $uri $uri/ /admin/index.html;
              }
              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            NGINX
            nginx -t
            systemctl restart nginx
            systemctl enable nginx

Outputs:
  CustomerWebsiteURL:
    Description: Customer shopping website
    Value: !Sub http://${WebServer.PublicIp}/

  AdminDashboardURL:
    Description: Protected admin analytics dashboard
    Value: !Sub http://${WebServer.PublicIp}/admin/

  AdminUsername:
    Description: Admin dashboard username
    Value: !Ref AdminUsername

  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !GetAtt HttpApi.ApiEndpoint

  S3BucketName:
    Description: Short S3 bucket name
    Value: !Ref RawOrdersBucket

  OrdersTableName:
    Description: Short DynamoDB orders table name
    Value: !Ref OrdersTable

  UsersTableName:
    Description: Short DynamoDB users table name
    Value: !Ref UsersTable

  DynamoDBTable:
    Description: DynamoDB orders table
    Value: !Ref OrdersTable

  RawOrdersBucket:
    Description: S3 bucket for raw order JSON files
    Value: !Ref RawOrdersBucket

  EC2InstanceId:
    Description: EC2 instance
    Value: !Ref WebServer
